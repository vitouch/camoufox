name: Build Linux amd64

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUILD_TARGET: linux,x86_64
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space and add swap for the LTO link
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 24G /camoufox.swap
          sudo chmod 600 /camoufox.swap
          sudo mkswap /camoufox.swap
          sudo swapon /camoufox.swap

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ccache fontconfig libsqlite3-dev msitools p7zip-full

      - name: Prepare the source tree
        run: python3 -m ci.run_prepare

      - name: Build and package
        working-directory: browser
        run: |
          make fonts-extract
          python3 multibuild.py --target linux --arch x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camoufox-linux-amd64
          path: browser/dist/camoufox-*-lin.x86_64.zip
          compression-level: 0
          if-no-files-found: error
